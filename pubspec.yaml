name: studyflow
description: "StudyFlow - 智能学习计时与规划应用"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 数据库
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # 图表
  fl_chart: ^0.69.0

  # 存储
  shared_preferences: ^2.3.3

  # 日期
  intl: ^0.20.1

  # UUID
  uuid: ^4.5.1

  # 路径
  path_provider: ^2.1.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # 代码生成
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
